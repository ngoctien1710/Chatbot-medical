<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #34495e;
            padding: 5px 12px;
            border-radius: 20px;
        }

        .model-selector label {
            font-size: 12px;
            color: #ecf0f1;
        }

        .model-selector select {
            background: #2c3e50;
            color: white;
            border: 1px solid #667eea;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .model-selector select:focus {
            outline: none;
            border-color: #5a67d8;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .model-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .retrieval-badge {
            display: inline-block;
            background: #e7f8ee;
            color: #0f7a3f;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .retrieval-snippets {
            margin-top: 10px;
            padding: 10px;
            border: 1px dashed #d5d9de;
            border-radius: 10px;
            background: #fafcfe;
            font-size: 12px;
            color: #34495e;
        }

        .retrieval-item {
            margin-top: 6px;
            line-height: 1.4;
        }

        .message-time {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .feedback-buttons {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .feedback-buttons button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }

        .feedback-buttons button:hover {
            transform: scale(1.05);
        }

        .agree-btn {
            background: #10b981;
            color: white;
        }

        .disagree-btn {
            background: #ef4444;
            color: white;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .input-area button:hover {
            background: #5a67d8;
        }

        .comment-box {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        .comment-box input {
            flex: 1;
            padding: 8px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 12px;
        }

        .comment-box button {
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <div class="model-selector">
                    <label>🤖 Model:</label>
                    <select id="modelSelect">
                        <option value="deepseek">DeepSeek</option>
                        <option value="gpt-3.5">GPT-3.5 Turbo</option>
                        <option value="gpt-4">GPT-4</option>
                        <option value="claude-2">Claude 2</option>
                        <option value="gemini-pro">Gemini Pro</option>
                    </select>
                </div>
            </div>
            <span>AI Assistant</span>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Nhập tin nhắn của bạn...">
            <button id="sendBtn">Gửi</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        let currentSessionId = null;
        let waitingForFeedback = false;
        let currentMessageIndex = null;
        let currentModel = 'deepseek';

        // DOM elements
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelect = document.getElementById('modelSelect');

        // Helper: Get model display name
        function getModelDisplayName(modelId) {
            const models = {
                'deepseek': 'DeepSeek',
                'gpt-3.5': 'GPT-3.5',
                'gpt-4': 'GPT-4',
                'claude-2': 'Claude 2',
                'gemini-pro': 'Gemini Pro'
            };
            return models[modelId] || modelId;
        }

        // Helper: Add message to chat
        function addMessage(text, type, timestamp = new Date(), model = null, retrieval = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            let modelBadge = '';
            if (type === 'ai' && model) {
                modelBadge = `<span class="model-badge">${getModelDisplayName(model)}</span>`;
            }

            let retrievalBadge = '';
            let retrievalSnippetHtml = '';
            if (type === 'ai' && retrieval) {
                const status = retrieval.retrieval_status || 'unknown';
                const topK = Number(retrieval.top_k || 0);
                retrievalBadge = `<span class="retrieval-badge">RAG: ${status} | top-${topK}</span>`;

                if (Array.isArray(retrieval.snippets) && retrieval.snippets.length > 0) {
                    const snippetLines = retrieval.snippets
                        .map((item, idx) => {
                            const sourceId = item.doc_id || 'unknown';
                            const score = Number(item.score || 0).toFixed(3);
                            return `<div class="retrieval-item"><strong>[${idx + 1}] ${escapeHtml(sourceId)}</strong> (${score}): ${escapeHtml(item.snippet || '')}</div>`;
                        })
                        .join('');

                    retrievalSnippetHtml = `<div class="retrieval-snippets"><strong>Retrieved context</strong>${snippetLines}</div>`;
                }
            }
            
            messageDiv.innerHTML = `
                <div class="message-content">
                    ${escapeHtml(text)}
                    ${modelBadge}
                    ${retrievalBadge}
                </div>
                ${retrievalSnippetHtml}
                <div class="message-time">${timestamp.toLocaleTimeString()}</div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        // Helper: Add feedback buttons to AI message
        function addFeedbackButtons(messageDiv, messageIndex) {
            const buttonsDiv = document.createElement('div');
            buttonsDiv.className = 'feedback-buttons';
            buttonsDiv.innerHTML = `
                <button class="agree-btn" onclick="handleAgree(${messageIndex})">✓ Agree</button>
                <button class="disagree-btn" onclick="handleDisagree(${messageIndex})">✗ Disagree</button>
            `;
            messageDiv.appendChild(buttonsDiv);
        }

        // Helper: Add comment input
        function addCommentInput(messageIndex, isAgree = true) {
            const commentDiv = document.createElement('div');
            commentDiv.className = 'comment-box';
            commentDiv.innerHTML = `
                <input type="text" id="commentInput${messageIndex}" placeholder="${isAgree ? 'Nhập comment (tùy chọn)...' : 'Nhập feedback để cải thiện câu trả lời...'}">
                <button onclick="submitFeedback(${messageIndex}, ${isAgree})">Gửi</button>
            `;
            
            // Find the last message and append comment box
            const messages = document.querySelectorAll('.message.ai');
            const lastAIMessage = messages[messages.length - 1];
            if (lastAIMessage) {
                lastAIMessage.appendChild(commentDiv);
            }
        }

        // Handle Agree button click
        window.handleAgree = (messageIndex) => {
            addCommentInput(messageIndex, true);
            waitingForFeedback = true;
            currentMessageIndex = messageIndex;
        };

        // Handle Disagree button click
        window.handleDisagree = (messageIndex) => {
            addCommentInput(messageIndex, false);
            waitingForFeedback = true;
            currentMessageIndex = messageIndex;
        };

        // Submit feedback
        window.submitFeedback = async (messageIndex, isAgree) => {
            const commentInput = document.getElementById(`commentInput${messageIndex}`);
            const feedback = commentInput ? commentInput.value : '';
            
            const action = isAgree ? 'agree' : 'disagree';
            
            try {
                const response = await fetch(`${API_BASE}/chat/feedback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        action: action,
                        feedback: feedback
                    })
                });
                
                const data = await response.json();
                
                if (action === 'agree') {
                    addMessage('✓ Bạn đã đồng ý với câu trả lời', 'user');
                    waitingForFeedback = false;
                    currentSessionId = null;
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                } else if (action === 'disagree' && data.response) {
                    // Add the new AI response
                    const newAIMessage = addMessage(data.response, 'ai', new Date(), currentModel, data.retrieval);
                    addFeedbackButtons(newAIMessage, messageIndex + 1);
                    waitingForFeedback = false;
                }
                
                // Remove comment box
                if (commentInput) {
                    commentInput.parentElement.remove();
                }
                
            } catch (error) {
                console.error('Error submitting feedback:', error);
                alert('Có lỗi xảy ra. Vui lòng thử lại.');
            }
        };

        // Send message to start new session
        async function sendMessage() {
            const query = messageInput.value.trim();
            if (!query) return;
            
            // Lấy model đang chọn
            currentModel = modelSelect.value;
            
            // Disable input while waiting for response
            messageInput.disabled = true;
            sendBtn.disabled = true;
            
            // Add user message
            addMessage(query, 'user');
            messageInput.value = '';
            
            try {
                // GỬI MODEL LÊN BACKEND - ĐÂY LÀ PHẦN QUAN TRỌNG
                const response = await fetch(`${API_BASE}/chat/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        query: query,
                        model: currentModel  // <--- Gửi model lên backend
                    })
                });
                
                const data = await response.json();
                currentSessionId = data.session_id;
                
                // Add AI response with model badge
                const aiMessage = addMessage(data.response, 'ai', new Date(), currentModel, data.retrieval);
                addFeedbackButtons(aiMessage, 0);
                
            } catch (error) {
                console.error('Error:', error);
                addMessage('Lỗi kết nối đến server. Vui lòng kiểm tra lại.', 'ai');
            } finally {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        // Helper: Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        // Welcome message
        setTimeout(() => {
            addMessage('Xin chào! Tôi là trợ lý AI. Hãy chọn model và nhập câu hỏi của bạn để bắt đầu.', 'ai');
        }, 500);
    </script>
</body>
</html>
